services:
  pai:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    init: true
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:6081:6081"
    environment:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      LIBGL_DRI3_DISABLE: "1"
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: "xcb"
      XDG_RUNTIME_DIR: "/tmp/runtime-root"
    volumes:
      - ./recordings:/recordings
    restart: "no"
